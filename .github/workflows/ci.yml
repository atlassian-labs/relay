name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here needs to write to the repository, and a
# token that cannot write is the simplest protection against a malicious pull
# request. Jobs that need more must opt in explicitly.
permissions:
  contents: read

# Superseded runs on the same ref are pointless once a newer commit exists.
# `main` is never cancelled so every pushed commit keeps a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The gates `bun run check` runs locally, fanned out so each one reports its
  # own status and a slow gate does not hold up the others.
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every failing gate in one run instead of stopping at the first.
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            script: typecheck
          - name: Lint
            script: lint
          - name: Effect Shape Gate
            script: lint:effect-shape
          - name: Architecture Boundaries
            script: lint:boundaries
          - name: Format Check
            script: format:check
          - name: Unit Tests
            script: test:unit
          - name: Build
            script: build
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag: a tag can be
      # moved to point at different code after review.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Only Bun's download cache is kept; node_modules is rebuilt from it on
      # every run so a stale tree can never mask a lockfile change. Pull
      # requests can restore the base branch cache but cannot overwrite it.
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Bun version
        run: bun run scripts/check-bun-version.ts

      - name: Run ${{ matrix.name }}
        run: bun run ${{ matrix.script }}
