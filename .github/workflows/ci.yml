name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here needs to write to the repository, and a
# token that cannot write is the simplest protection against a malicious pull
# request. Jobs that need more must opt in explicitly.
permissions:
  contents: read

# Superseded runs on the same ref are pointless once a newer commit exists.
# `main` is never cancelled so every pushed commit keeps a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The gates `bun run check` runs locally, fanned out so each one reports its
  # own status and a slow gate does not hold up the others.
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every failing gate in one run instead of stopping at the first.
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            script: typecheck
          - name: Lint
            script: lint
          - name: Effect Shape Gate
            script: lint:effect-shape
          - name: Architecture Boundaries
            script: lint:boundaries
          - name: Format Check
            script: format:check
          - name: Unit Tests
            script: test:unit
          - name: Build
            script: build
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag: a tag can be
      # moved to point at different code after review.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Only Bun's download cache is kept; node_modules is rebuilt from it on
      # every run so a stale tree can never mask a lockfile change. Pull
      # requests can restore the base branch cache but cannot overwrite it.
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Bun version
        run: bun run scripts/check-bun-version.ts

      - name: Run ${{ matrix.name }}
        run: bun run ${{ matrix.script }}

  # Real end-to-end lanes that drive the built CLI through a pseudo-terminal.
  # They run alongside validation rather than after it, as in the previous
  # pipeline, and each lane builds what it needs itself.
  e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: app
            name: App Frame Capture
            script: test:e2e:app
            packages: expect
          - id: cli
            name: CLI
            script: test:e2e:cli
            packages: expect
          - id: child-process-exit
            name: Child Process Exit
            script: test:e2e:child-process-exit
          - id: normalized-diff
            name: Normalized Diff
            script: test:e2e:normalized-diff
          - id: ui-polish
            name: UI Polish
            script: test:e2e:ui-polish
          - id: slash-command
            name: Slash Command
            script: test:e2e:slash-command
          - id: chat-autoscroll
            name: Chat Autoscroll
            script: test:e2e:chat-autoscroll
          - id: split-mouse-escape
            name: Split Mouse Escape
            script: test:e2e:split-mouse-escape
            packages: zsh
          - id: prompt-history
            name: Prompt History
            script: test:e2e:prompt-history
          - id: prompt-queue
            name: Prompt Queue
            script: test:e2e:prompt-queue
          - id: startup-tips
            name: Startup Tips
            script: test:e2e:startup-tips
          - id: tui-stress
            name: TUI Stress
            script: test:e2e:tui-stress
          - id: path-autocomplete
            name: Path Autocomplete
            script: test:e2e:path-autocomplete
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # The runner image already provides git and python3.
      - name: Install system packages
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E ${{ matrix.name }}
        run: bun run ${{ matrix.script }}

      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.id }}
          path: test-results/real-e2e/
          if-no-files-found: ignore
          retention-days: 7
